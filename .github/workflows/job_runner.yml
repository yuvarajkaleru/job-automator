name: Hyderabad Fresher Job Bot

# ------------------------------------------------------------------------------------------
# WHEN IT RUNS (IST)
#   Job scans : 8 AM (overnight digest), 11 AM, 2 PM, 5 PM, 8 PM, 11 PM
#   Tap checks: handled at every scan, for 2 min after each scan, and by the tap-check
#               trigger on cron-job.org (see SETUP in the chat / README)
#
# PRIMARY trigger = cron-job.org calling "workflow_dispatch" on time (GitHub's own cron is
# often 30 min to several hours late, and sometimes skipped).
# BACKUP trigger  = the GitHub cron below, 20 min after each slot. It does nothing if the
# primary already scanned, and never sends anything during quiet hours (11:30 PM - 7:30 AM).
# ------------------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scrape = find new jobs, approvals = only process Telegram taps'
        type: choice
        options: [scrape, approvals]
        default: scrape
  schedule:
    # UTC = IST - 5:30  ->  8:20, 11:20, 14:20, 17:20, 20:20, 23:20 IST
    - cron: '50 2,5,8,11,14,17 * * *'

# One run at a time, so runs never fight over jobs.db or Telegram updates.
concurrency:
  group: job-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jobs-db-

      # Decides scrape / approvals / skip using only built-in Python, BEFORE installing
      # anything, so idle runs finish in ~15 seconds and cost 1 minute.
      - name: Plan
        id: plan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python3 run_jobs.py plan "${{ inputs.mode || 'scrape' }}"

      - name: Set up Python
        if: steps.plan.outputs.action != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node
        if: steps.plan.outputs.action != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.plan.outputs.action != 'skip'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Run bot (${{ steps.plan.outputs.action }})
        if: steps.plan.outputs.action != 'skip'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUME_EMAIL: ${{ secrets.RESUME_EMAIL }}
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}
          # Tuning (see CONFIG at the top of run_jobs.py):
          LISTEN_SECONDS: '120'        # stay online 2 min after alerts for instant Apply
          MAX_JOBS_PER_RUN: '12'
          MAX_JOBS_OVERNIGHT: '20'     # the 8 AM digest can send more
          MAX_AGE_DAYS: '3'            # drop postings older than this
        run: python run_jobs.py ${{ steps.plan.outputs.action }}

      - name: Save job database
        if: always() && steps.plan.outputs.action != 'skip'
        uses: actions/cache/save@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}
